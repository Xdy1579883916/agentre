# dev 只覆盖 dev 分支：不跑 lint / test，二进制在 runner 上编好后送到目标机，
# 目标机上用 deploy/Dockerfile 的 prebuilt 目标打成镜像再 compose。
#
# 这条流水线没有门禁，dev 分支上也没有别的门禁接着：.github/workflows/ci.yml 只在
# push main / develop/* 与 pull_request 上触发，dev 不在其中，也没有开着的 PR。
# lint / test 靠本地 make lint / make test，以及 dev 合入 main 时那个 PR 上的 ci.yml。
#
# 送文件与跑远端脚本都走本实例的动作镜像 gitea.icodef.com/actions/{scp-action,ssh-action}
# （appleboy 那两个的镜像）。runner 上不再自己写密钥文件和 ssh_config：私钥以字符串
# 交给动作，主机指纹由下面那步现扫现钉。

name: Deploy agentred dev

on:
  push:
    branches:
      - dev

# 连推两次时，两条流水线会同时改目标机上同一个部署目录再各自 compose up，
# 后写覆盖先写，机器可能停在旧二进制而两条流水线都是绿的
concurrency:
  group: deploy-agentred-dev
  cancel-in-progress: false

env:
  GOPROXY: ${{ secrets.GOPROXY && secrets.GOPROXY || 'https://goproxy.cn,direct' }}
  DEPLOY_HOST: ${{ secrets.DEV_SSH_HOST }}
  DEPLOY_USER: ${{ secrets.DEV_SSH_USER && secrets.DEV_SSH_USER || 'root' }}
  DEPLOY_PORT: ${{ secrets.DEV_SSH_PORT && secrets.DEV_SSH_PORT || '22' }}
  DEPLOY_DIR: ${{ secrets.DEV_AGENTRED_DIR && secrets.DEV_AGENTRED_DIR || '/srv/agentred-dev' }}
  # 目标机拉不到 docker.io（实测 registry-1.docker.io 直接 EOF），走可达的镜像源。
  # Dockerfile 里的默认值保持上游正确，这个覆盖只属于本网络
  RUNTIME_IMAGE: ${{ secrets.RUNTIME_IMAGE && secrets.RUNTIME_IMAGE || 'docker.m.daocloud.io/library/node:24-bookworm-slim' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - name: Set outputs
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          # buildinfo.ShortCommitID() 截前 7 位，而这个仓库 git 的短 sha 是 8 位，
          # 拿 8 位去比 agentred --version 的输出会永远不匹配
          echo "sha7=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      # 复用 Makefile 的 agentred-linux，ldflags 与本地构建同一组符号
      - name: Build agentred
        run: make agentred-linux AGENTRED_GOOS=linux AGENTRED_GOARCH=amd64

      # scp-action 不给文件改名（只把源路径原样打进 tar），而 bin/ 是 prebuilt 目标的
      # 整个构建上下文、里面那份必须正好叫 agentred：先在 runner 上改成 .next，
      # 到目标机上再原子换掉正在跑的那份。原来的 `scp ... bin/agentred.next` 也是这个效果
      - name: Rename artifact to agentred.next
        run: mv build/bin/agentred-linux-amd64 build/bin/agentred.next

      - name: Check deploy credentials
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "缺少 secret DEV_SSH_HOST" >&2; exit 1; }
          test -n "$SSH_KEY" || { echo "缺少 secret DEV_SSH_KEY" >&2; exit 1; }

      # 不传 fingerprint 时 drone-ssh 是直接不校验主机（源码里退化成 InsecureIgnoreHostKey），
      # 所以这里先扫一把再钉住，等价于原来 ssh_config 里的 StrictHostKeyChecking=accept-new：
      # 首连信任，同一条流水线内不再接受换 key
      - name: Pin target host key
        id: hostkey
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP:-$(mktemp -d)}"
          ssh-keyscan -T 10 -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$tmp/host_keys" 2>/dev/null || true
          fingerprint=""
          # 挑哪一把不能想当然：Go 客户端（x/crypto）自己有偏好顺序，服务端按 RFC 取
          # 「客户端列表里它有的第一个」。这个顺序是 ecdsa-256 > ecdsa-384 > ecdsa-521 >
          # rsa > ed25519（ed25519 排最后），实测两台 Debian 机器上协商到的都是 ECDSA；
          # 挑错类型会直接以 host key fingerprint mismatch 收场
          fingerprint="$(ssh-keygen -lf "$tmp/host_keys" 2>/dev/null | awk '
            /\(ECDSA\)/ && $1 == 256 { print "1", $2 }
            /\(ECDSA\)/ && $1 == 384 { print "2", $2 }
            /\(ECDSA\)/ && $1 == 521 { print "3", $2 }
            /\(RSA\)/                 { print "4", $2 }
            /\(ED25519\)/             { print "5", $2 }
          ' | sort -n | head -1 | awk '{print $2}')"
          test -n "$fingerprint" || { echo "扫不到 $DEPLOY_HOST 的主机密钥：宁可失败也不退回不校验" >&2; exit 1; }
          echo "已钉住 $DEPLOY_HOST 的主机指纹: $fingerprint"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # 目标目录由 drone-scp 自己 mkdir -p，不需要原来那句 ssh mkdir。
      # deploy/ 这一层用 strip_components 去掉，落点与 `scp deploy/* dev-deploy:$DEPLOY_DIR/` 一致
      - name: Upload compose files
        uses: actions/scp-action@v1.0.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          port: ${{ env.DEPLOY_PORT }}
          key: ${{ secrets.DEV_SSH_KEY }}
          fingerprint: ${{ steps.hostkey.outputs.fingerprint }}
          source: 'deploy/Dockerfile,deploy/docker-compose.yml'
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 1

      - name: Upload agentred binary
        uses: actions/scp-action@v1.0.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          port: ${{ env.DEPLOY_PORT }}
          key: ${{ secrets.DEV_SSH_KEY }}
          fingerprint: ${{ steps.hostkey.outputs.fingerprint }}
          source: 'build/bin/agentred.next'
          target: ${{ env.DEPLOY_DIR }}/bin
          strip_components: 2

      - name: Deploy to ${{ env.DEPLOY_HOST }}
        uses: actions/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          port: ${{ env.DEPLOY_PORT }}
          key: ${{ secrets.DEV_SSH_KEY }}
          fingerprint: ${{ steps.hostkey.outputs.fingerprint }}
          # envs 只写变量名：drone-ssh 从 runner 环境按名字取值，再用单引号转义拼进远端脚本
          envs: DEPLOY_DIR,RUNTIME_IMAGE
          command_timeout: 15m
          script: |
            # 动作是把脚本当远端命令交给登录 shell 跑（不再是 `ssh bash -s` 喂 stdin），
            # 目标机 root 的登录 shell 是 bash，pipefail 才有意义
            set -euo pipefail
            cd "$DEPLOY_DIR"

            test -s bin/agentred.next || { echo "bin/agentred.next 没传上来或者是空的" >&2; exit 1; }
            chmod 755 bin/agentred.next
            mv -f bin/agentred.next bin/agentred

            prev=$(docker image inspect -f '{{.Id}}' agentre/agentred:dev 2>/dev/null || true)

            # 上下文只给 bin/：部署目录里的 .env 不该进构建上下文。三个 CLI 的层由
            # RUNTIME_IMAGE 与版本 arg 决定，不变就全部命中 layer cache
            docker build -f Dockerfile --target prebuilt \
              --build-arg RUNTIME_IMAGE="$RUNTIME_IMAGE" \
              -t agentre/agentred:dev bin

            docker compose -f docker-compose.yml config -q
            docker compose -f docker-compose.yml up -d --force-recreate

            # tag 每次复用，上一个镜像会变成 dangling 攒在机器上。容器已经换到新镜像了才删得掉；
            # 不用 image prune -f，那会连这台机器上别的 dangling 镜像一起收走
            now=$(docker image inspect -f '{{.Id}}' agentre/agentred:dev)
            if [ -n "$prev" ] && [ "$prev" != "$now" ]; then
              docker image rm "$prev" >/dev/null 2>&1 || true
            fi

      # 判据有两条：daemon 真的应答本地 IPC，且跑的是本次 commit。
      # 只看容器 Up 不够——agentred 起不来时容器会反复重启，某一秒抓到的也是 Up
      - name: Verify deployment
        uses: actions/ssh-action@v1.2.5
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          port: ${{ env.DEPLOY_PORT }}
          key: ${{ secrets.DEV_SSH_KEY }}
          fingerprint: ${{ steps.hostkey.outputs.fingerprint }}
          envs: DEPLOY_DIR
          command_timeout: 5m
          script: |
            set -uo pipefail
            WANT_COMMIT="${{ steps.vars.outputs.sha7 }}"
            cd "$DEPLOY_DIR" || exit 1
            cid=$(docker compose -f docker-compose.yml ps -q agentred)
            test -n "$cid" || { echo "容器没起来" >&2; exit 1; }

            for i in $(seq 1 30); do
              if docker exec "$cid" agentred status >/dev/null 2>&1; then
                got=$(docker exec "$cid" agentred --version 2>/dev/null || true)
                case "$got" in
                  *"$WANT_COMMIT"*)
                    echo "部署校验通过(第 ${i} 次尝试): $got"
                    exit 0
                    ;;
                  *)
                    echo "agentred 起来了但 commit 不对: 期望 $WANT_COMMIT, 实际 '$got'" >&2
                    exit 1
                    ;;
                esac
              fi
              sleep 2
            done
            echo "agentred status 连试 30 次都没应答,dev 环境停留在坏状态(不自动回滚)" >&2
            docker compose -f docker-compose.yml logs --tail=80 agentred >&2 || true
            exit 1

      # 私钥只在动作内部解析成 signer（easyssh 直接 ParsePrivateKey，不落盘），
      # 所以原来那步 Remove SSH credentials 没有要删的东西了
