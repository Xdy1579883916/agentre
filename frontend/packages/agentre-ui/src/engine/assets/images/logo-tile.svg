<!-- 浏览器标签页的 Agentre 瓦片。满版底板，因为浏览器和 Windows 任务栏一样没有统一底板规范，标签页按 16px 画；build/windows/icon.svg 是同一套几何的 .ico 导出孪生体，build/appicon.svg 是留了投影边距的 macOS 变体。同目录的 logo-mark.svg 是透明底的裸笔画，给顶栏和引擎面板这些已经有背景的位置用。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Agentre</title>
  <defs>
    <radialGradient id="tile" cx="36%" cy="22%" r="84%">
      <stop stop-color="#2A5B88"/>
      <stop offset=".48" stop-color="#0F2C4C"/>
      <stop offset="1" stop-color="#061423"/>
    </radialGradient>
    <linearGradient id="stroke" x1="120" y1="900" x2="900" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9DCF6"/>
      <stop offset=".5" stop-color="#F2FAFF"/>
      <stop offset="1" stop-color="#A8CFEE"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="64" y="64" width="896" height="896" rx="218"/></clipPath>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect x="64" y="64" width="896" height="896" rx="218" fill="url(#tile)"/>
    <ellipse cx="365" cy="145" rx="430" ry="292" fill="#7FB2D8" opacity=".12"/>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="216" fill="none" stroke="#6E9BBD" stroke-width="4" opacity=".4"/>

  <g transform="translate(126 124) scale(1.53)">
    <g fill="none" stroke="url(#stroke)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M93 391 218 143M419 391 294 143"/>
      <circle cx="256" cy="87" r="49" fill="#0A1D33"/>
      <circle cx="86" cy="425" r="47" fill="#0A1D33"/>
      <circle cx="426" cy="425" r="47" fill="#0A1D33"/>
      <path d="M139 312h181"/>
      <path d="m303 279 33 33-33 33"/>
    </g>
    <circle cx="86" cy="425" r="19" fill="#2FD8E8"/>
    <circle cx="426" cy="425" r="19" fill="#B47CF2"/>
  </g>
</svg>
